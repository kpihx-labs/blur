[package]
name = "blur"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "BUSL-1.1"
description = "Local-first launcher, profiles, policy metadata, and LAN discovery for Blur"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
if-addrs = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = true
